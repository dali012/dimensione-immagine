<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description"
    content="Dimensione Immagine | Moda inclusiva e accessibile. Collezioni Uomo, Donna e Plus Size a Messina." />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Dimensione Immagine" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Dimensione Immagine | Moda Inclusiva</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://embeds.iubenda.com">
  <link rel="preconnect" href="https://idb.iubenda.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    window.addEventListener("load", () => {
      const loadIubenda = () => {
        if (window.__iubendaLoaded) return;
        window.__iubendaLoaded = true;
        const script = document.createElement("script");
        script.src =
          "https://embeds.iubenda.com/widgets/ef677c05-ac27-443c-a4c8-bfa72cbe62af.js";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      };

      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(loadIubenda, { timeout: 2000 });
      } else {
        setTimeout(loadIubenda, 2000);
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
