<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description"
    content="Dimensione Immagine | Moda inclusiva e accessibile. Collezioni Uomo, Donna e Plus Size a Messina." />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Dimensione Immagine" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Dimensione Immagine | Moda Inclusiva</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://zqo9eojr.apicdn.sanity.io" crossorigin>
  <link rel="dns-prefetch" href="//zqo9eojr.apicdn.sanity.io">
  <link
    rel="preload"
    as="image"
    href="/images/video/women-hero-video-poster-640.webp"
    fetchpriority="high"
    media="(max-width: 767px)"
  >
  <link
    rel="preload"
    as="image"
    href="/images/video/women-hero-video-poster.webp"
    media="(min-width: 768px)"
  >
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    >
  </noscript>
  <script>
    (function () {
      const loadIubenda = () => {
        if (window.__iubendaLoaded) return;
        window.__iubendaLoaded = true;
        const script = document.createElement("script");
        script.src =
          "https://embeds.iubenda.com/widgets/ef677c05-ac27-443c-a4c8-bfa72cbe62af.js";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      };

      // Keep legal scripts off the initial critical path.
      const kickoff = () => {
        window.removeEventListener("scroll", kickoff, { passive: true });
        window.removeEventListener("pointerdown", kickoff);
        window.removeEventListener("keydown", kickoff);
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadIubenda, { timeout: 3000 });
        } else {
          setTimeout(loadIubenda, 3000);
        }
      };

      window.addEventListener("scroll", kickoff, { passive: true, once: true });
      window.addEventListener("pointerdown", kickoff, { once: true });
      window.addEventListener("keydown", kickoff, { once: true });
      setTimeout(kickoff, 8000);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
